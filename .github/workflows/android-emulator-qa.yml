name: IdleRPG Android emulator QA

on:
  push:
    branches:
      - "qa/**"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Flow to exercise"
        required: false
        default: "launch_crash"
        type: choice
        options:
          - "launch_crash"
          - "battle_flow"

permissions:
  contents: read

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE: com.idlerpg.game
      ACTIVITY: .MainActivity
      SCENARIO: ${{ inputs.scenario || 'launch_crash' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          mkdir -p artifacts
          ./gradlew :app:assembleDebug --console=plain 2>&1 | tee artifacts/build.log

      - name: Run IdleRPG emulator capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set +e

            OUT="$PWD/artifacts/emulator"
            COMPONENT="$PACKAGE/$ACTIVITY"
            TRACE_DEVICE="/data/local/tmp/idlerpg-launch.pftrace"
            PERF_DATA_DEVICE="/data/local/tmp/idlerpg.perf.data"
            mkdir -p "$OUT"

            printf 'scenario=%s\npackage=%s\ncomponent=%s\n' "$SCENARIO" "$PACKAGE" "$COMPONENT" > "$OUT/run-info.txt"
            adb devices -l > "$OUT/00-adb-devices.txt" 2>&1
            adb shell getprop > "$OUT/00-device-properties.txt" 2>&1
            adb shell wm size > "$OUT/00-window-size.txt" 2>&1
            adb shell wm density > "$OUT/00-window-density.txt" 2>&1
            adb shell cmd package resolve-activity --brief "$PACKAGE" > "$OUT/00-resolved-activity.txt" 2>&1
            adb shell dumpsys package "$PACKAGE" > "$OUT/00-package-state.txt" 2>&1

            adb install -r "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" > "$OUT/00-install.txt" 2>&1
            adb shell pm clear "$PACKAGE" > "$OUT/00-clear-data.txt" 2>&1
            adb shell am force-stop "$PACKAGE" > "$OUT/00-force-stop.txt" 2>&1
            adb shell dumpsys gfxinfo "$PACKAGE" reset > "$OUT/00-gfxinfo-reset.txt" 2>&1
            adb logcat -c

            adb shell rm -f "$TRACE_DEVICE"
            adb shell perfetto -o "$TRACE_DEVICE" -t 20s --app "$PACKAGE" sched freq idle am wm gfx view binder_driver hal dalvik > "$OUT/02-perfetto-console.txt" 2>&1 &
            PERFETTO_HOST_PID=$!
            sleep 1

            adb shell am start -W -n "$COMPONENT" > "$OUT/01-launch.txt" 2>&1
            LAUNCH_CODE=$?
            sleep 8

            adb exec-out screencap -p > "$OUT/03-after-launch.png" 2> "$OUT/03-after-launch-screenshot.err"
            adb exec-out uiautomator dump /dev/tty > "$OUT/03-after-launch-ui.xml" 2> "$OUT/03-after-launch-ui.err"
            adb shell dumpsys activity activities > "$OUT/03-after-launch-activity.txt" 2>&1
            adb shell dumpsys window windows > "$OUT/03-after-launch-window.txt" 2>&1
            adb shell dumpsys input_method > "$OUT/03-after-launch-input-method.txt" 2>&1

            PID_AFTER_LAUNCH="$(adb shell pidof -s "$PACKAGE" 2>/dev/null | tr -d '\r' | xargs)"
            printf 'launch_exit_code=%s\npid_after_launch=%s\n' "$LAUNCH_CODE" "$PID_AFTER_LAUNCH" > "$OUT/04-launch-state.txt"

            if [ -n "$PID_AFTER_LAUNCH" ]; then
              adb shell rm -f "$PERF_DATA_DEVICE"
              adb shell simpleperf record --app "$PACKAGE" -o "$PERF_DATA_DEVICE" -e cpu-clock -f 4000 -g --duration 12 > "$OUT/07-simpleperf-console.txt" 2>&1
              adb pull "$PERF_DATA_DEVICE" "$OUT/idlerpg.perf.data" > "$OUT/07-simpleperf-pull.txt" 2>&1
              adb shell simpleperf report -i "$PERF_DATA_DEVICE" > "$OUT/07-simpleperf-report.txt" 2>&1
            else
              printf 'Skipped because the app had no live process after launch.\n' > "$OUT/07-simpleperf-console.txt"
            fi

            wait "$PERFETTO_HOST_PID" > "$OUT/02-perfetto-wait.txt" 2>&1
            adb pull "$TRACE_DEVICE" "$OUT/idlerpg-launch.pftrace" > "$OUT/02-perfetto-pull.txt" 2>&1

            adb shell dumpsys gfxinfo "$PACKAGE" > "$OUT/08-gfxinfo.txt" 2>&1
            adb shell dumpsys gfxinfo "$PACKAGE" framestats > "$OUT/08-gfxinfo-framestats.txt" 2>&1
            adb shell dumpsys meminfo "$PACKAGE" > "$OUT/08-meminfo.txt" 2>&1
            adb shell dumpsys cpuinfo > "$OUT/08-cpuinfo.txt" 2>&1
            adb logcat -d -v threadtime > "$OUT/09-logcat.txt" 2>&1
            adb logcat -b crash -d > "$OUT/09-crash-buffer.txt" 2>&1
            adb shell dumpsys activity activities > "$OUT/09-final-activity.txt" 2>&1
            adb shell dumpsys window windows > "$OUT/09-final-window.txt" 2>&1
            adb shell dumpsys package "$PACKAGE" > "$OUT/09-final-package-state.txt" 2>&1

            if [ -n "$PID_AFTER_LAUNCH" ]; then
              LAUNCH_VERDICT="launch_did_not_crash"
            elif grep -Eiq "$PACKAGE|FATAL EXCEPTION|AndroidRuntime" "$OUT/09-crash-buffer.txt"; then
              LAUNCH_VERDICT="launch_crash_evidence"
            else
              LAUNCH_VERDICT="app_not_running_after_launch"
            fi

            {
              printf 'scenario=%s\n' "$SCENARIO"
              printf 'package=%s\n' "$PACKAGE"
              printf 'component=%s\n' "$COMPONENT"
              printf 'launch_exit_code=%s\n' "$LAUNCH_CODE"
              printf 'pid_after_launch=%s\n' "$PID_AFTER_LAUNCH"
              printf 'launch_verdict=%s\n' "$LAUNCH_VERDICT"
            } > "$OUT/verdict.txt"

            {
              echo "## IdleRPG emulator QA"
              echo
              echo "- Scenario: \`$SCENARIO\`"
              echo "- Launch verdict: \`$LAUNCH_VERDICT\`"
              echo "- Evidence is uploaded under \`artifacts/emulator/\`."
            } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idlerpg-emulator-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
