name: IdleRPG Android emulator QA

on:
  push:
    branches:
      - "qa/**"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Flow to exercise"
        required: false
        default: "launch_crash"
        type: choice
        options:
          - "launch_crash"
          - "battle_flow"

permissions:
  contents: read

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE: com.idlerpg.game
      ACTIVITY: .MainActivity
      SCENARIO: ${{ inputs.scenario || 'launch_crash' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          mkdir -p artifacts
          ./gradlew :app:assembleDebug --console=plain 2>&1 | tee artifacts/build.log

      - name: Run IdleRPG emulator capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-emulator-qa.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idlerpg-emulator-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
